<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account — GoodPlate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <p class="eyebrow">GoodPlate</p>
    <h1>Create your account</h1>
    <p class="sub">Sign up as a restaurant with surplus food, or a receiver/NGO looking to collect it.</p>

    <div id="errorBox" class="error-msg" style="display:none;"></div>

    <form id="registerForm">
      <div class="field">
        <label>I am a...</label>
        <div class="role-select" style="grid-template-columns: 1fr 1fr 1fr;">
          <label><input type="radio" name="role" value="restaurant" checked /><span>Restaurant</span></label>
          <label><input type="radio" name="role" value="receiver" /><span>Receiver / NGO</span></label>
          <label><input type="radio" name="role" value="admin" /><span>Admin</span></label>
        </div>
      </div>

      <div class="field">
        <label for="name">Your Name</label>
        <input type="text" id="name" required placeholder="Full name" />
      </div>
      <div class="field" id="orgField">
        <label id="orgLabel" for="organizationName">Restaurant Name</label>
        <input type="text" id="organizationName" placeholder="e.g. Green Spoon" />
      </div>
      <div class="field" id="adminSecretField" style="display:none;">
        <label for="adminSecret">Admin Secret Key</label>
        <input type="password" id="adminSecret" placeholder="Ask your project lead for this" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="text" id="phone" placeholder="01XXXXXXXXX" />
      </div>
      <div class="field">
        <label for="address">Address</label>
        <input type="text" id="address" placeholder="Area, City" />
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-foot">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </div>
</div>

<script src="src/js/api.js"></script>
<script src="src/js/utils.js"></script>
<script src="src/js/auth.js"></script>
<script>initRegisterPage();</script>
</body>
</html>
